name: CI / Frontend

on:
  push:
    branches:
      - master
    paths:
      - 'apps/native/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'apps/native/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch:
    inputs:
      build_android:
        description: 'Gerar APK/AAB (EAS Build para Android)?'
        required: true
        type: boolean
        default: false

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  dependencies:
    name: 📦 Instalando Dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  code-quality:
    name: 🔍 Análise de Padrão (Lint)
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Biome Check
        run: pnpm exec turbo run check --filter=native

  typecheck:
    name: 📝 Validação de Tipos
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: TypeScript Check
        run: pnpm exec turbo run check-types --filter=native

  unit-tests:
    name: 🧪 Testes Unitários
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Tests
        run: pnpm exec turbo run test --filter=native

  deploy:
    name: 🚀 Deploy Expo (EAS)
    needs: [code-quality, typecheck, unit-tests]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 📦 Setup Node & pnpm
        uses: ./.github/actions/setup

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Publicar OTA Update (Production)
        working-directory: ./apps/native
        run: eas update --auto --non-interactive

      - name: 📦 EAS Build (Android)
        if: github.event.inputs.build_android == 'true'
        working-directory: ./apps/native
        run: eas build --platform android --profile production --non-interactive

  report:
    name: 📊 Relatório da Esteira
    needs: [code-quality, typecheck, unit-tests, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Gerar Annotations (README)
        run: |
          echo "# 📱 Relatório do Frontend (Expo)" >> $GITHUB_STEP_SUMMARY
          echo "Este relatório consolida os resultados da esteira para esta versão do código:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Resultados das Validações" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 **Análise Estática (Lint)** | ${{ needs.code-quality.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Verifica padrões de código com Biome. |" >> $GITHUB_STEP_SUMMARY
          echo "| 📝 **Typecheck (TypeScript)** | ${{ needs.typecheck.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Validações de tipagem estática do projeto. |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 **Testes Unitários (Jest)** | ${{ needs.unit-tests.result == 'success' && '✅ Passou' || '❌ Falhou' }} | Executa os testes isolados dos componentes. |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 **Deploy (EAS)** | ${{ needs.deploy.result == 'success' && '✅ Passou' || (needs.deploy.result == 'skipped' && '⏭️ Ignorado (Ambiente de PR)') || '❌ Falhou' }} | Atualização OTA / Build Android nativo. |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Dica:** Você pode ver os detalhes de cada falha clicando nos jobs na barra lateral à esquerda." >> $GITHUB_STEP_SUMMARY
