name: CI / Backend

on:
  push:
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  dependencies:
    name: 📦 Instalando Dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

  code-quality:
    name: 🔍 Análise de Padrão (Lint)
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Biome Check
        run: turbo run check --filter=server

  typecheck:
    name: 📝 Validação de Tipos
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: TypeScript Check
        run: pnpm --filter server exec tsc --noEmit

  unit-tests:
    name: 🧪 Testes Unitários e Integração
    needs: dependencies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://test:test@localhost:5432/test"
      GOOGLE_SERVER_CLIENT_ID: "test-client-id"
      GOOGLE_CLIENT_SECRET: "test-client-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Tests
        run: turbo run test --filter=server

  build:
    name: 🏗️ Construindo a Aplicação
    needs: [code-quality, typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build Server
        run: turbo run build --filter=server
