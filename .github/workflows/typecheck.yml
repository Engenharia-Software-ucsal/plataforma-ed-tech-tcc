name: Typecheck

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  typecheck:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      
      - name: Typecheck
        run: pnpm run check-types
